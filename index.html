    // --- AUDIO SYSTEM (Web Audio API) ---
    let soundEnabled = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, vol = 0.08) {
        if (!soundEnabled) return;
        initAudio();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.log("Audio error", e);
        }
    }

        nav: () => playTone(350, 'sine', 0.12, 0.04),

        wrong: () => { playTone(180, 'sawtooth', 0.15); setTimeout(() => playTone(130, 'sawtooth', 0.25), 120); },
        reveal: () => { playTone(700, 'sine', 0.06, 0.02); setTimeout(() => playTone(1100, 'sine', 0.12, 0.02), 60); }
    };

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-btn').innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high text-sm"></i>' : '<i class="fa-solid fa-volume-xmark text-sm"></i>';

                "Karena manusia cenderung berhenti berpikir dan menganggap kebiasaan sebagai kebenaran.",
                "Karena orang-orang benar selalu tidak peduli.",
                "Karena tradisi nenek moyang pasti selalu benar."
            ],
            correct: 1,
            rationale: "Kebatilan bertahan bukan karena ia kuat, melainkan karena manusia cenderung mempertahankan status quo tanpa mau mengkritisinya (QS. Al-Baqarah: 170)."
        },
        {
            q: "Apa perbedaan paling mendasar antara 'Pengganggu Tanpa Nilai' dan 'Pembongkar Kebatilan'?",
            options: [
                "Pengganggu mencari atensi/viral, sedangkan pembongkar kebatilan berlandaskan ilmu untuk perubahan nyata.",
                "Pengganggu selalu gagal, sedangkan pembongkar kebatilan tidak pernah menghadapi ujian.",
                "Pengganggu menggunakan kekerasan, sedangkan pembongkar hanya menggunakan media sosial.",
                "Tidak ada perbedaan sama sekali."
            ],
            correct: 0,
            rationale: "Pengganggu tanpa nilai hanya memicu kebisingan kosong, sementara pembongkar kebatilan dilandasi ilmu dan niat ikhlas untuk transformasi."
        },
        {
            q: "Faktor utama apa yang menyebabkan oligarki Makkah menolak keras dakwah Rasulullah ﷺ?",
            options: [
                "Karena Rasulullah ﷺ tidak pandai berbicara.",
                "Karena ajaran Islam mengancam monopoli ekonomi berhala dan kedudukan sosial-politik mereka.",
                "Karena Makkah diserang oleh kerajaan asing.",
                "Karena masyarakat Makkah tidak mengenal sosok Rasulullah ﷺ."
            ],
            correct: 1,
            rationale: "Penolakan terjadi karena Islam menggugat sistem oligarki bisnis berhala, penindasan sosial, serta kasta keturunan bangsawan Quraysh."
        },
        {
            q: "Manakah kelebihan dan tantangan dari pejuang perubahan yang memilih jalur 'Dari Luar Sistem'?",
            options: [
                "Kelebihan: Punya wewenang instan. Tantangan: Modal uang besar.",
                "Kelebihan: Bebas menawarkan paradigma baru. Tantangan: Membutuhkan kesabaran panjang & rawan tekanan.",
                "Kelebihan: Tidak ada risiko. Tantangan: Tidak bisa berbuat apa-apa.",
                "Kelebihan: Mudah kompromi. Tantangan: Kehilangan prinsip."
            ],
            correct: 1,
            rationale: "Jalur dari luar (pemikir/ulama) bebas menyampaikan kritik segar, namun dampaknya memerlukan proses dan waktu yang panjang."
        },
        {
            q: "Sesuai QS. Ali Imran: 104, mengapa seorang pembaharu membutuhkan fondasi 'Jamaah / Jaringan'?",
            options: [
                "Agar perjuangan tidak mudah dipadamkan dan memiliki kekuatan kolektif.",
                "Agar bisa mengumpulkan dana politik yang melimpah.",
                "Agar namanya terkenal di seluruh dunia.",
                "Agar bisa melakukan perlawanan fisik yang merusak."
            ],
            correct: 0,
            rationale: "Perjuangan individual sangat rapuh. Jaringan/jamaah memastikan gerakan amar ma'ruf nahi munkar berkesinambungan dan memiliki perlindungan bersama."
        }
    ];

    // --- STATE MANAGEMENT ---
    let currentSlide = 0;
    let quizScore = 0;
    let quizState = Array(quizData.length).fill(-1);

    const container = document.getElementById('slide-container');
    const progressBar = document.getElementById('progress-bar');
    const progressPercent = document.getElementById('progress-percent');
    const slideCounter = document.getElementById('slide-counter');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function initSlides() {
        let quizCounter = 0;
        slidesData.forEach((slide, index) => {
            const div = document.createElement('div');
            div.className = `slide ${index === 0 ? 'active' : ''}`;
            div.id = `slide-${index}`;
            
            if (slide.type === 'quiz') {
                slide.qIndex = quizCounter;
                div.innerHTML = generateQuizHTML(quizCounter);
                quizCounter++;
            } else if (slide.type === 'result') {
                div.innerHTML = `<div id="result-container" class="w-full h-full flex items-center justify-center"></div>`;
            } else {
                div.innerHTML = slide.html;
            }
            container.appendChild(div);
        });
        updateUI();
    }

    function generateQuizHTML(qIndex) {
        const q = quizData[qIndex];
        let optionsHTML = q.options.map((opt, i) => `
            <button id="opt-${qIndex}-${i}" onclick="answerQuiz(${qIndex}, ${i})" class="w-full text-left p-3.5 rounded-xl glass-panel hover:bg-brand-500/10 transition font-medium text-xs sm:text-sm border border-slate-200 dark:border-slate-800 flex items-start space-x-3">
                <span class="w-5 h-5 rounded-md bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-center leading-5 shrink-0 text-xs font-bold">${String.fromCharCode(65+i)}</span>
                <span class="flex-1">${opt}</span>
            </button>
        `).join('');

        return `
            <div class="w-full max-w-2xl mx-auto max-h-[calc(100vh-160px)] overflow-y-auto custom-scroll px-2 py-1">
                <div class="flex justify-between items-center mb-4 border-b border-slate-200 dark:border-slate-800 pb-2">
                    <span class="font-bold text-xs text-brand-500 uppercase tracking-wider">Pertanyaan ${qIndex + 1} dari ${quizData.length}</span>
                    <i class="fa-solid fa-brain text-slate-400 text-sm"></i>
                </div>
                <h3 class="text-sm sm:text-base font-bold mb-4 leading-relaxed">${q.q}</h3>
                <div class="space-y-2.5">${optionsHTML}</div>
                <div id="feedback-${qIndex}" class="mt-4 p-3 rounded-xl hidden text-xs font-medium leading-relaxed"></div>
            </div>`;
    }

    function updateUI() {
        document.querySelectorAll('.slide').forEach((el, index) => {
            el.className = 'slide';
            if (index === currentSlide) {
                el.classList.add('active');
            } else if (index < currentSlide) {
                el.classList.add('prev');
            }
        });

        const progress = Math.round(((currentSlide + 1) / slidesData.length) * 100);
        progressBar.style.width = `${progress}%`;
        progressPercent.innerText = `${progress}%`;
        slideCounter.innerText = `${currentSlide + 1} / ${slidesData.length}`;

        prevBtn.disabled = currentSlide === 0;
        
        if (slidesData[currentSlide].type === 'quiz') {
            const qIndex = slidesData[currentSlide].qIndex;
            nextBtn.style.display = quizState[qIndex] !== -1 ? 'flex' : 'none';
        } else if (slidesData[currentSlide].type === 'result') {
            nextBtn.style.display = 'none';
            renderResult();
        } else {
            nextBtn.style.display = 'flex';
        }
    }

    function nextSlide() {
        if (currentSlide < slidesData.length - 1) {
            sounds.nav();
            currentSlide++;
            updateUI();
        }
    }

    function prevSlide() {
        if (currentSlide > 0) {
            sounds.nav();
            currentSlide--;
            updateUI();
        }
    }

    function startQuiz() {
        nextSlide();
    }

    function answerQuiz(qIndex, selectedIndex) {
        if (quizState[qIndex] !== -1) return;

        quizState[qIndex] = selectedIndex;
        const q = quizData[qIndex];
        const isCorrect = selectedIndex === q.correct;
        
        if (isCorrect) {
            quizScore++;
            sounds.correct();
        } else {
            sounds.wrong();
        }

        q.options.forEach((_, i) => {
            const btn = document.getElementById(`opt-${qIndex}-${i}`);
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            if (i === q.correct) {
                btn.classList.remove('opacity-50');
                btn.classList.add('bg-brand-500/20', 'border-brand-500', 'text-brand-600', 'dark:text-brand-300');
            } else if (i === selectedIndex && !isCorrect) {
                btn.classList.remove('opacity-50');
                btn.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-600', 'dark:text-rose-300');
            }
        });

        const fb = document.getElementById(`feedback-${qIndex}`);
        fb.classList.remove('hidden');
        if (isCorrect) {
            fb.classList.add('bg-brand-500/10', 'text-brand-700', 'dark:text-brand-300', 'border', 'border-brand-500/30');
            fb.innerHTML = `<strong>Tepat Sekali!</strong> ${q.rationale}`;
        } else {
            fb.classList.add('bg-rose-500/10', 'text-rose-700', 'dark:text-rose-300', 'border', 'border-rose-500/30');
            fb.innerHTML = `<strong>Kurang Tepat.</strong> ${q.rationale}`;
        }

        nextBtn.style.display = 'flex';
    }

    function renderResult() {
        const resContainer = document.getElementById('result-container');
        const percentage = Math.round((quizScore / quizData.length) * 100);
        let msg = "", icon = "", color = "";

        if (percentage === 100) {
            msg = "Sempurna! Anda sangat memahami prinsip Pembaharu Kaffah.";
            icon = "fa-crown"; color = "text-gold-500";
        } else if (percentage >= 60) {
            msg = "Bagus! Anda memahami esensi dasar Trickster Islam.";
            icon = "fa-star"; color = "text-brand-500";
        } else {
            msg = "Tetap semangat! Silakan ulangi untuk memperdalam materi.";
            icon = "fa-book-open"; color = "text-blue-500";
        }

        resContainer.innerHTML = `
            <div class="text-center glass-panel p-6 sm:p-8 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 max-w-sm w-full mx-4">
                <i class="fa-solid ${icon} text-5xl ${color} mb-3"></i>
                <h2 class="text-2xl font-extrabold mb-1">Skor: ${percentage}%</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">${quizScore} dari ${quizData.length} pertanyaan benar</p>
                <p class="text-xs sm:text-sm font-medium mb-6 text-slate-700 dark:text-slate-200">${msg}</p>
                <button onclick="location.reload()" class="w-full py-3 bg-brand-500 text-white font-bold rounded-xl hover:bg-brand-600 transition shadow-lg shadow-brand-500/30 text-xs sm:text-sm">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Pelajari Lagi
                </button>
            </div>
        `;
    }

    window.onload = () => {
        initSlides();
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight' && nextBtn.style.display !== 'none') nextSlide();
            if(e.key === 'ArrowLeft' && !prevBtn.disabled) prevSlide();
        });
    };
</script>
</body>
</html>
